 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Video Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    video {
      border: 2px solid #007bff;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Animal Intrusion Detection</a>
  </div>
</nav>

<div class="container text-center mt-4">
  <h3>Live Video Stream from Your Camera</h3>
  <video id="video" width="640" height="480" autoplay muted playsinline></video>
  <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
  <div id="status" class="mt-3 text-success fw-bold"></div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
  &copy; 2025 AnimalDetect. All rights reserved.
</footer>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const ctx = canvas.getContext('2d');

  // Get access to user's webcam
  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    video.srcObject = stream;
    status.innerText = "Webcam access granted. Processing...";
  }).catch(err => {
    status.innerText = "Unable to access webcam: " + err;
  });

  // Send frames to Flask backend every 500ms
  setInterval(() => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/jpeg');
    fetch('/process_frame', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageData })
    })
    .then(response => response.json())
    .then(data => {
      console.log("Detection:", data);
      status.innerText = `Tracking ${data.tracks?.length || 0} object(s).`;
    })
    .catch(err => {
      console.error(err);
      status.innerText = "Error processing frame.";
    });
  }, 500);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
